# GasChanger live RTT attachment. This file intentionally contains no reset,
# halt, flash, or program command.
bindto 127.0.0.1
gdb_port disabled
tcl_port disabled
telnet_port disabled

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
adapter speed 1800
source [find target/stm32f1x.cfg]

init
rtt setup 0x20000000 0x0000C000 "SEGGER RTT"
rtt polling_interval 10
rtt start
rtt server start 9090 0
